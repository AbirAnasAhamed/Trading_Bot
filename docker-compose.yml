version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: cryptobot_db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpassword
      POSTGRES_DB: cryptobot
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: cryptobot_backend
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=traderpassword
      - POSTGRES_DB=cryptobot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: cryptobot_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cryptobot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

  celery_worker:
    build:
      context: ./backend
    container_name: cryptobot_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=traderpassword
      - POSTGRES_DB=cryptobot
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - C_FORCE_ROOT=true
      - CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP=True
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    env_file:
      - ./backend/.env

volumes:
  timescaledb_data:
