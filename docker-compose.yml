version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: cryptobot_db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: traderpassword
      POSTGRES_DB: cryptobot
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: cryptobot_backend
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=trader
      - POSTGRES_PASSWORD=traderpassword
      - POSTGRES_DB=cryptobot
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: cryptobot_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timescaledb_data:
